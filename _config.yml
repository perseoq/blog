title: Roy's Blog
description: Mi blog personal
lang: es

# Tema remoto
remote_theme: perseoq/edragon_theme

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-paginate

# Paginación de la portada
paginate: 5
paginate_path: "/page:num/"

# Las entradas usan el layout "post" automáticamente
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
